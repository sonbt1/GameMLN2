<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MC · Đấu trường tiền tệ</title><link rel="stylesheet" href="styles.css"></head><body><div class="scanlines"></div><main class="shell admin-shell"><header class="topbar"><a class="brand" href="/">ĐẤU TRƯỜNG TIỀN TỆ</a><span>MÀN MC / MÁY CHIẾU</span></header><section id="setup" class="card"><h1>Tạo phòng chơi</h1><button id="create" class="primary">Tạo phòng mới</button><label>Mã phòng đã có<input id="code" maxlength="6"></label><button id="open" class="ghost">Mở phòng</button><p id="error" class="error"></p></section><section id="dashboard" hidden><div class="admin-hero card"><div><p class="eyebrow">PHÒNG ĐANG CHẠY</p><h1 id="roomCode">------</h1><p id="roomMeta">0 người chơi</p></div><img id="qr" alt="Mã QR vào phòng"><a id="joinLink" target="_blank" rel="noreferrer">Liên kết vào phòng</a></div><div class="admin-grid"><section class="card control-card"><h2>Điều khiển ngày <span id="day">—</span></h2><label>Thời lượng ngày (giây)<input id="duration" type="number" min="10" max="600" value="60"></label><div class="admin-actions"><button data-action="intro">Bắt đầu · giới thiệu luật</button><button data-action="startDay">Bắt đầu ngày / ngày tiếp theo</button><button data-action="publishCoins">Công bố tiền xu ngày 1</button><button data-action="lock">Khóa giao dịch</button><button data-action="reveal">Công bố kết quả</button><button data-action="next">Sang ngày tiếp</button><button data-action="pause">Tạm dừng / tiếp tục</button></div><p id="phaseLabel" class="notice"></p><div class="timer large" id="timer">—</div></section><section class="card stage-card"><h2>Bối cảnh lớp học</h2><h3 id="title">Phòng chờ</h3><p id="news"></p><div id="prices" class="prices"></div><blockquote id="knowledge"></blockquote><ol id="rank"></ol></section></div><section class="card roster"><h2>Người chơi <span id="count">0</span>/50</h2><div id="players" class="players"></div><label>Kick theo tên<input id="kickName"></label><button data-action="kick" class="danger">Kick người chơi</button></section><p id="notice" role="status"></p></section></main><script src="/socket.io/socket.io.js"></script><script type="module" src="admin.js"></script></body></html>
